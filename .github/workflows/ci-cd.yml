name: Build & Test Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check-out del codice
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build dell'immagine Docker
      run: |
        docker build -t mia-app:${{ github.sha }} .

    - name: Test di avvio del container
      run: |
        docker run -d -p 8080:8080 --name test-container mia-app:${{ github.sha }}
        sleep 3
        curl --fail http://localhost:8080 || exit 1
        docker stop test-container